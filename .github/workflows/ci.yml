name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [blog, users]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ${{ matrix.app }}
        run: npm run check -w @nyameko/${{ matrix.app }}

      - name: Build ${{ matrix.app }}
        run: npm run build -w @nyameko/${{ matrix.app }}
