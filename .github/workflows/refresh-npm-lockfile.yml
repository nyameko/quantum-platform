name: Refresh npm lockfile

on:
  push:
    branches: [fix/npm-audit-2026-10]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npm-audit-2026-10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only
      - run: npm audit fix --package-lock-only
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - name: Commit refreshed lockfile
        run: |
          rm .github/workflows/refresh-npm-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-npm-lockfile.yml
          git commit -m "deps: refresh npm lockfile after audit fixes"
          git push
