name: User API administrator tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  administrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e apps/user-api
      - run: python apps/user-api/manage.py test portal.test_agent_admin --settings=config.test_settings
      - run: python apps/user-api/manage.py makemigrations --check --dry-run --settings=config.test_settings
