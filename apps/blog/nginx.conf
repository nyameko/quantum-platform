server {
    listen 8080;
    server_name _;

    # Container is behind Traefik/TLS. Keep nginx-generated
    # directory redirects relative so internal http://:8080 never
    # leaks into browser-visible Location headers.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
