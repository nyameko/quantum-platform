[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-platform-user-api"
version = "0.4.0"
description = "Django backend for the Quantum Platform User Portal."
requires-python = ">=3.12"
dependencies = [
  "Django>=6.1,<6.2",
  "django-allauth[headless,mfa]>=65.19.3,<66",
  "djangorestframework>=3.18,<3.19",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "whitenoise>=6.11,<7",
  "prometheus-client>=0.22,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "portal*"]

[tool.ruff]
line-length = 100
target-version = "py312"
