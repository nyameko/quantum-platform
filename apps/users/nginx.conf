server {
    listen 8080;
    server_name _;

    # Behind Traefik/TLS. Never redirect to the pod's internal port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Astro builds static HTML. Browser-only session checks are too late:
    # protected forms can flash before JavaScript redirects.
    # Ask the existing Django session API BEFORE serving protected HTML.
    # Do not cache this response or expose the user's session on the page.
    location = /_portal_auth_check {
        internal;
        proxy_pass http://quantum-platform-user-api.quantum-platform.svc.cluster.local:8000/api/v1/me/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host quantum.nyameko.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Always return to the same-origin login page. Backend 5xx fails
    # closed (error), not open (a protected static page).
    location @portal_login {
        add_header Cache-Control "no-store" always;
        return 302 /login/;
    }

    # Protect ALL path variants including direct /index.html requests,
    # so users cannot bypass this check by loading an Astro static file.
    location ~ ^/(profile|programmes|security|dashboard|agent|runs|workbench|access)(/|$) {
        auth_request /_portal_auth_check;
        error_page 401 403 = @portal_login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # These account forms are private too. Keep password-reset, signup,
    # verification, and the login flow publicly accessible.
    location ~ ^/account/(access-keys|mfa)(/|$) {
        auth_request /_portal_auth_check;
        error_page 401 403 = @portal_login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ~ ^/account/password(/index\.html)?/?$ {
        auth_request /_portal_auth_check;
        error_page 401 403 = @portal_login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
